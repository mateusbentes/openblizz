name: Linux build and release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
            asset: openblizz-linux-x86_64
          - architecture: aarch64
            runner: ubuntu-24.04-arm
            asset: openblizz-linux-aarch64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake g++ pkg-config \
            libcurl4-openssl-dev libssl-dev zlib1g-dev liblz4-dev \
            nlohmann-json3-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOPENBLIZZ_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Prepare binary
        run: |
          mkdir -p dist
          install -m 0755 build/openblizz "dist/${{ matrix.asset }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish Linux release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download architecture binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-openblizz-linux-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          set -euo pipefail
          # upload-artifact/download-artifact do not guarantee executable
          # permission bits, so restore the release mode before validation.
          chmod 0755 dist/openblizz-linux-x86_64 dist/openblizz-linux-aarch64
          test -f dist/openblizz-linux-x86_64
          test -f dist/openblizz-linux-aarch64
          test -x dist/openblizz-linux-x86_64
          test -x dist/openblizz-linux-aarch64
          (cd dist && sha256sum openblizz-linux-x86_64 openblizz-linux-aarch64 > SHA256SUMS)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/openblizz-linux-x86_64 \
            dist/openblizz-linux-aarch64 \
            dist/SHA256SUMS \
            --verify-tag \
            --title "OpenBlizz $GITHUB_REF_NAME" \
            --generate-notes
