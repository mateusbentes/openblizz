name: Linux release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake g++ pkg-config \
            libcurl4-openssl-dev libssl-dev zlib1g-dev liblz4-dev \
            nlohmann-json3-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOPENBLIZZ_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Prepare release assets
        run: |
          mkdir -p dist
          install -m 0755 build/openblizz dist/openblizz-linux-x86_64
          sha256sum dist/openblizz-linux-x86_64 > dist/SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/openblizz-linux-x86_64 dist/SHA256SUMS \
            --verify-tag \
            --title "OpenBlizz $GITHUB_REF_NAME" \
            --generate-notes
